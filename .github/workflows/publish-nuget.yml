name: Publish NuGet Packages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for publishing'
        required: false
        default: 'Manual publish'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

permissions:
  contents: read

env:
  DOTNET_VERSION: '11.0.100-rc.1.26425.128'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Pack & Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (both supported runtimes)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.1.26425.128

      - name: Restore
        run: dotnet restore SharpPortico.slnx

      - name: Build (Release)
        run: dotnet build SharpPortico.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack NuGet packages
        run: |
          dotnet pack src/SharpPortico.SourceGenerator/SharpPortico.SourceGenerator.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true
          dotnet pack src/SharpPortico.Runtime/SharpPortico.Runtime.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true
          dotnet pack src/SharpPortico.Cli/SharpPortico.Cli.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true

      - name: Consume the packed package the way a stranger does
        run: bash ./.github/scripts/consume-package.sh "$GITHUB_WORKSPACE/artifacts"

      # Publishing is the last moment this can fail cheaply: the tool package is installed into a temporary
      # tool path and run (text summary, --format json, and a refusal), so a feed entry that installs but
      # answers nothing is caught here rather than by the first user.
      - name: The packed tool installs and answers
        run: bash ./.github/scripts/check-tool-package.sh "$GITHUB_WORKSPACE/artifacts"

      - name: The API key is present
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo '::error title=Missing secret::NUGET_API_KEY is not set, so nothing can be published.'
            exit 1
          fi
          # nuget.org answers 403 for a key that is correct except for a stray newline, and the log masks the value
          # so it cannot be read. Report the shape instead: a newline pasted into `gh secret set` is invisible in the
          # secret's metadata and turns every push into the same 403 as an expired key.
          echo "::notice::NUGET_API_KEY is ${#NUGET_API_KEY} characters"
          if printf '%s' "$NUGET_API_KEY" | grep -q '[[:space:]]'; then
            echo '::error title=The secret carries whitespace::NUGET_API_KEY contains a space or a line break, which nuget.org rejects as an invalid key. Store it without a trailing newline: gh secret set NUGET_API_KEY --body "<key>"'
            exit 1
          fi

      # A 403 from nuget.org is about the key, not the package - it stopped the 1.3.0-preview.2 release without
      # anyone noticing the feed had stopped moving. Print the response and, on 403, name the secret to renew.
      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for pkg in ./artifacts/*.nupkg; do
            name="$(basename "$pkg")"
            echo "  ↗ Pushing $name"
            if ! output="$(dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate 2>&1)"; then
              echo "$output"
              if printf '%s' "$output" | grep -q '403'; then
                echo "::error title=nuget.org rejected the API key::403 for $name. NUGET_API_KEY is invalid, expired, or scoped to another account. Renew it at https://www.nuget.org/account/apikeys, run 'gh secret set NUGET_API_KEY', then re-run this workflow - --skip-duplicate makes the retry safe."
              else
                echo "::error title=Push failed::nuget.org rejected $name"
              fi
              exit 1
            fi
            echo "$output"
          done
          echo "✅ Published to NuGet.org"

      - name: Release summary
        run: |
          echo "## 📦 NuGet Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          ls -1 ./artifacts/*.nupkg | xargs -I {} basename {} >> $GITHUB_STEP_SUMMARY