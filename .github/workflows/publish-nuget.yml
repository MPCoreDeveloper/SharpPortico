name: Publish NuGet Packages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for publishing'
        required: false
        default: 'Manual publish'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Pack & Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SharpPortico.slnx

      - name: Build (Release)
        run: dotnet build SharpPortico.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack NuGet packages
        run: |
          dotnet pack src/SharpPortico.SourceGenerator/SharpPortico.SourceGenerator.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true
          dotnet pack src/SharpPortico.Runtime/SharpPortico.Runtime.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true
          dotnet pack src/SharpPortico.Cli/SharpPortico.Cli.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true

      - name: Publish to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for pkg in ./artifacts/*.nupkg; do
            echo "  ↗ Pushing $(basename "$pkg")"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done
          echo "✅ Published to NuGet.org"

      - name: Release summary
        run: |
          echo "## 📦 NuGet Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          ls -1 ./artifacts/*.nupkg | xargs -I {} basename {} >> $GITHUB_STEP_SUMMARY