name: Publish NuGet Packages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for publishing'
        required: false
        default: 'Manual publish'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

permissions:
  contents: read
  id-token: write # lets this job ask GitHub for the OIDC token nuget.org exchanges for a key

env:
  DOTNET_VERSION: '11.0.100-rc.1.26425.128'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Pack & Publish to NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (both supported runtimes)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.100-rc.1.26425.128

      - name: Restore
        run: dotnet restore SharpPortico.slnx

      - name: Build (Release)
        run: dotnet build SharpPortico.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack NuGet packages
        run: |
          dotnet pack src/SharpPortico.SourceGenerator/SharpPortico.SourceGenerator.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true
          dotnet pack src/SharpPortico.Runtime/SharpPortico.Runtime.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true
          dotnet pack src/SharpPortico.Cli/SharpPortico.Cli.csproj \
            --configuration Release --no-restore --output ./artifacts /p:ContinuousIntegrationBuild=true

      - name: Consume the packed package the way a stranger does
        run: bash ./.github/scripts/consume-package.sh "$GITHUB_WORKSPACE/artifacts"

      # Publishing is the last moment this can fail cheaply: the tool package is installed into a temporary
      # tool path and run (text summary, --format json, and a refusal), so a feed entry that installs but
      # answers nothing is caught here rather than by the first user.
      - name: The packed tool installs and answers
        run: bash ./.github/scripts/check-tool-package.sh "$GITHUB_WORKSPACE/artifacts"

      # Trusted publishing: this step trades the workflow's OIDC token for a temporary API key (valid for one
      # hour) that nuget.org matched against the repository's trust policy. Nothing long-lived is stored, so
      # there is no key to expire - the 403 that stopped two releases cannot happen for that reason again.
      # `user` must be the nuget.org *personal* account that created the policy, not the organization that
      # owns it. Organizations cannot log in, so naming one here fails the exchange with HTTP 401
      # ("No matching trust policy owned by user ...") - which reads like a missing policy but is a missing
      # login, and cost this repository one release. The action is pinned to the commit its v1 tag points
      # at, because a tag can be moved and this step is handed the token that mints a key.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      # A 403 here is the policy, not the package: the token's repository owner, repository and workflow file
      # must match the policy exactly, and the policy's scope must cover the package id.
      - name: Publish to NuGet.org
        shell: bash
        run: |
          set -euo pipefail
          for pkg in ./artifacts/*.nupkg; do
            name="$(basename "$pkg")"
            echo "  ↗ Pushing $name"
            if ! output="$(dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate 2>&1)"; then
              echo "$output"
              if printf '%s' "$output" | grep -q '403'; then
                echo "::error title=nuget.org rejected the temporary key::403 for $name. A trusted publishing run did not match its policy. Check Repository Owner, Repository and Workflow File (publish-nuget.yml, the file name only) at https://www.nuget.org/account/trustedpublishing, and that the policy's scope covers ${name%%.*}.*"
              elif printf '%s' "$output" | grep -q '401'; then
                echo "::error title=nuget.org did not accept the token::401 for $name. NUGET_USERNAME must be the personal account that created the trust policy; the organization that owns the policy cannot log in."
              else
                echo "::error title=Push failed::nuget.org rejected $name"
              fi
              exit 1
            fi
            echo "$output"
          done
          echo "✅ Published to NuGet.org"

      - name: Release summary
        run: |
          echo "## 📦 NuGet Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          ls -1 ./artifacts/*.nupkg | xargs -I {} basename {} >> $GITHUB_STEP_SUMMARY